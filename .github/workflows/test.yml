name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aggressive "don't block work on flaky CI" policy:
#
#   - Anything mechanical that runs in < 30s and rarely fails (fmt
#     checks, type-checks) stays as a hard gate.
#   - Anything that depends on infra we don't control (Kafka / Redis
#     brokers, large GitHub runner disk, network during cargo
#     fetches), or is style-only (clippy warnings, lint), is set to
#     continue-on-error. CI shows green so it doesn't gate every
#     downstream change, and the diagnostic still appears in the run
#     log when something does break.
#
#   - One opt-in escape hatch: setting STRICT_CI=1 on a job's env
#     (or in the repo's variables) would un-soften the checks. We
#     don't wire it up here because the user explicitly asked CI to
#     stop failing.

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Free up ~30 GB on the runner so cargo test --workspace
      # doesn't ENOSPC mid-build. The default ubuntu-latest runner
      # ships ~14 GB free; the bulk of the disk is consumed by tools
      # this workflow never uses (Android, .NET, Haskell, PowerShell,
      # CodeQL caches, etc).
      - name: Reclaim runner disk
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                       /opt/ghc /opt/hostedtoolcache/CodeQL \
                       /opt/microsoft /usr/local/share/powershell \
                       /usr/lib/jvm /opt/google || true
          docker image prune --all --force || true
          sudo apt-get clean
          df -h

      # The SQL compiler's pom.xml targets Java 21; the runner's
      # default JDK 17 fails with "invalid target release: 19".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # pipeline-manager's build.rs runs `bun clean-install` on
      # js-packages/web-console; without bun the cargo build panics.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System deps for rdkafka / openssl / mold
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev libssl-dev pkg-config \
            libsasl2-dev zlib1g-dev cmake build-essential \
            golang-go

      - name: Build the SQL compiler jar (tests need it)
        working-directory: sql-to-dbsp-compiler
        run: ./build.sh

      # cargo fmt is mechanical, fast, and useful — keep as a hard gate.
      - run: cargo fmt --all -- --check

      # clippy with -D warnings turns every style nit into a CI red.
      # Drop -D warnings and continue-on-error so a stylistic drift
      # doesn't block merges.
      - run: cargo clippy --locked --no-deps
        continue-on-error: true

      # dbsp_adapters' test suite contains integration tests that need
      # live Kafka + Redis brokers; without a services block they
      # panic on BrokerTransportFailure / Connection refused. The rest
      # of the workspace tests can still flake on disk / network /
      # network-fetched test data, so mark the whole test run
      # continue-on-error too. CI surfaces failures in the log but
      # doesn't gate on them.
      - run: cargo test --workspace --exclude dbsp_adapters --no-fail-fast
        continue-on-error: true

  web-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js-packages/web-console
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: bun install --frozen-lockfile
      # TypeScript / svelte-check is fast and high signal — hard gate.
      - run: bun run check
      # bun run lint has been flaky on a PostCSS oddity in
      # ConnectorErrors.svelte for weeks. Don't gate on it.
      - run: bun run lint
        continue-on-error: true

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv tool install ruff
      # Cheap mechanical checks; keep as hard gates.
      - run: ruff check .
      - run: ruff format --check .
